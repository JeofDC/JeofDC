<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Aptitude Exam Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            500: '#334e68',
                            800: '#102a43',
                            900: '#0f172a',
                        },
                        brand: {
                            blue: '#2563eb',
                            teal: '#0d9488',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Top Global Header / Navigation -->
    <header class="bg-navy-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Logo & Title -->
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <div>
                        <span class="font-bold text-lg tracking-wide text-white block leading-none">Aptitude Hub</span>
                        <span class="text-xs text-slate-400">Applicant Assessment Platform</span>
                    </div>
                </div>

                <!-- Navigation Links (Dynamic by Role) -->
                <nav id="nav-menu" class="hidden md:flex space-x-1 text-sm font-medium">
                    <!-- Dynamic navigation buttons injected by JS -->
                </nav>

                <!-- Right Action Bar / Role Switcher -->
                <div class="flex items-center space-x-3">
                    <div class="bg-slate-800 rounded-lg p-1.5 flex items-center border border-slate-700">
                        <span class="text-xs text-slate-400 mr-2 pl-1 hidden sm:inline"><i class="fa-solid fa-user-gear mr-1"></i>Active Role:</span>
                        <select id="user-switcher" class="bg-slate-900 text-white text-xs rounded border border-slate-700 px-2 py-1 focus:outline-none focus:border-blue-500 cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div class="text-right hidden sm:block">
                        <div id="current-user-name" class="text-xs font-semibold text-slate-200">User</div>
                        <div id="current-user-role" class="text-[10px] text-teal-400 font-mono uppercase">Role</div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Sub-nav bar for mobile -->
        <div id="mobile-nav" class="md:hidden border-t border-slate-800 bg-navy-900 px-4 py-2 flex overflow-x-auto space-x-2 text-xs">
            <!-- Mobile nav items -->
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Views loaded dynamically by JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">
            <div>
                <span class="font-semibold text-slate-700">Applicant Aptitude Exam Hub</span> &copy; 2026. Secure & Professional Pre-Employment Testing.
            </div>
            <div class="flex space-x-4 text-slate-400">
                <span><i class="fa-solid fa-shield-halved text-teal-600 mr-1"></i>RBAC Protected</span>
                <span><i class="fa-solid fa-bolt text-blue-600 mr-1"></i>Real-time Scoring</span>
            </div>
        </div>
    </footer>

    <!-- Global Modal Container -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl max-w-3xl w-full p-6 relative border border-slate-100 max-h-[90vh] overflow-y-auto">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl flex items-center space-x-3 border-l-4 border-blue-500">
        <i id="toast-icon" class="fa-solid fa-circle-check text-green-400 text-lg"></i>
        <span id="toast-msg" class="text-sm">Notification message</span>
    </div>

    <!-- JavaScript App Entry -->
    <script src="/static/app.js"></script>
</body>
</html>
